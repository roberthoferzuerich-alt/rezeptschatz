<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="oliveGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9bb730"/>
      <stop offset="50%" stop-color="#8ea92c"/>
      <stop offset="100%" stop-color="#6f8520"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Solid Olive Green Background for Android Maskable/Adaptive Icons -->
  <rect width="512" height="512" rx="105" fill="url(#oliveGradient)"/>

  <!-- Golden Ring -->
  <circle cx="256" cy="256" r="215" fill="none" stroke="#f5c518" stroke-width="8" opacity="0.65"/>

  <!-- Open Recipe Book Emblem (White with Drop Shadow) -->
  <g filter="url(#shadow)">
    <!-- Book Left Page -->
    <path d="M 256 380 C 210 355 140 355 105 365 L 105 210 C 140 200 210 200 256 225 Z" fill="#ffffff"/>
    <!-- Book Right Page -->
    <path d="M 256 380 C 302 355 372 355 407 365 L 407 210 C 372 200 302 200 256 225 Z" fill="#ffffff"/>
    <!-- Spine Divider -->
    <path d="M 256 225 L 256 380" stroke="#d5d5d5" stroke-width="4"/>

    <!-- Chef Hat above Book -->
    <!-- Center Dome -->
    <circle cx="256" cy="145" r="48" fill="#ffffff"/>
    <!-- Left Puff -->
    <circle cx="215" cy="160" r="38" fill="#ffffff"/>
    <!-- Right Puff -->
    <circle cx="297" cy="160" r="38" fill="#ffffff"/>
    <!-- Hat Base Band (Gold) -->
    <rect x="200" y="185" width="112" height="20" rx="6" fill="#f5c518"/>

    <!-- Golden Bookmark Ribbon -->
    <path d="M 246 220 L 266 220 L 266 415 L 256 400 L 246 415 Z" fill="#f5c518"/>
  </g>
</svg>
